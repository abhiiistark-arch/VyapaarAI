services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - backend/.env
    ports:
      - "8000:8000"
    volumes:
      - api_data:/app/backend
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: postgres:16
    profiles: ["full"]
    environment:
      POSTGRES_USER: vyapaarai
      POSTGRES_PASSWORD: vyapaarai
      POSTGRES_DB: vyapaarai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    profiles: ["full"]
    ports:
      - "6379:6379"

volumes:
  api_data:
  pgdata:
